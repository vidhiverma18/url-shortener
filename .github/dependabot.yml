version: 2

# Grouped so that a routine patch bump is one reviewable pull request rather than fifteen.
# Ungrouped Dependabot output is the most common reason its pull requests stop being read.
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - 'org.springframework*'
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
