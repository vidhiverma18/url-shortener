spring:
  application:
    name: url-shortener
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shortener}
    username: ${SPRING_DATASOURCE_USERNAME:shortener}
    password: ${SPRING_DATASOURCE_PASSWORD:shortener_local_dev}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate is only allowed to check that the mapping
      # still matches it, so a drifted entity fails at startup instead of at 3am.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # Aggressively short: the cache is an optimisation, and waiting on an unhealthy
      # Redis would make the redirect path slower than skipping the cache entirely.
      timeout: 200ms
      connect-timeout: 200ms

server:
  error:
    include-stacktrace: never
  shutdown: graceful
  # Honour X-Forwarded-Proto from the TLS-terminating proxy. Without this the app believes
  # every request arrived over plain HTTP, and Spring Security suppresses the HSTS header on
  # non-secure requests — so HSTS would be configured, appear correct in code, and never
  # actually be sent.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    # Redis is a soft dependency: the service degrades but keeps serving without it,
    # so its state must not flip the pod's readiness probe.
    redis:
      enabled: false

shortener:
  base-url: ${SHORTENER_BASE_URL:http://localhost:8080}
  code-secret: ${SHORTENER_CODE_SECRET:local-development-only-change-me}
  cache-ttl: 10m
  negative-cache-ttl: 30s
  rate-limit-burst: 20
  rate-limit-per-minute: 60
  # Consecutive Redis failures before calls are skipped entirely, and for how long.
  # Guards against a hung server, which a timeout alone cannot: see ADR-009.
  cache-circuit-failure-threshold: 5
  cache-circuit-cooldown: 5s
  security:
    # No default. A signing key committed to a repository is a published private key, so when
    # this is unset the application generates a random one and warns; see ADR-011.
    jwt-secret: ${SHORTENER_JWT_SECRET:}
    # Preferred over the environment variable: env vars leak through /proc, crash dumps and
    # container inspection APIs. Point this at a Docker or Kubernetes secret mount.
    jwt-secret-file: ${SHORTENER_JWT_SECRET_FILE:}
    # Whether an unreachable revocation store rejects tokens or accepts them. False trades
    # prompt revocation for staying up during a Redis outage; the short token TTL is what
    # makes that trade survivable.
    revocation-fail-closed: ${SHORTENER_REVOCATION_FAIL_CLOSED:false}
    token-ttl: 1h
    login-attempts-per-minute: 10
    seed-demo-users: ${SHORTENER_SEED_DEMO_USERS:true}
  screening:
    enabled: ${SHORTENER_SCREENING_ENABLED:true}
    # Static baseline. Operators add to this at runtime via POST /api/v1/admin/blocked-domains,
    # because blocking a domain is a minutes-scale decision and a redeploy is not.
    blocked-domains: []
    # An unreachable reputation provider lets the link through and leaves it PENDING for the
    # rescan sweep, rather than stopping link creation because a third party is down.
    fail-open: true
    # Safe Browsing stays off until a key is supplied, so the service has no hard third-party
    # dependency out of the box.
    safe-browsing-api-key: ${SHORTENER_SAFE_BROWSING_KEY:}
    provider-timeout: 2s
    rescan-after: 24h
    rescan-interval: PT15M
    rescan-batch-size: 100
    blocklist-refresh-ms: 60000
  abuse:
    # Refused creations within the window before the account is suspended. Rate limiting caps
    # how fast someone tries; this responds to what they are trying.
    blocked-creation-threshold: 5
    blocked-creation-window: 1h
    auto-suspend: true
    # Flagged for review only. A spike looks the same whether the campaign is legitimate or
    # not, and taking down a real viral link is the more expensive mistake.
    click-velocity-per-minute: 600
  analytics:
    flush-interval-ms: 1000

logging:
  level:
    com.example.shortener: INFO
